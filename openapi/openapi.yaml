        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        preferredLanguage:
          $ref: "#/components/schemas/Language"
        bloodNetworkPresets:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/BloodNetworkPreset"
        avatarUrl:
          type:
            - string
            - "null"
          format: uri-reference
        createdAt:
          type: string
          format: date-time
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - fields
        - details
      properties:
        code:
          type: string
        message:
          type:
            - string
            - "null"
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        details:
          type: object
          additionalProperties: true
