          $ref: "#/components/schemas/GenealogicalDate"
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type:
            - string
            - "null"
          maxLength: 5000
    SurnameChangeEventRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - date
        - newSurname
      properties:
        type:
          type: string
          const: surname_change
