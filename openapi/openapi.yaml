openapi: 3.1.0
info:
  title: MyGenoTree API
  version: 0.2.0
  description: REST API for the local MyGenoTree MVP.
servers:
  - url: https://localhost/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check whether the local API is available
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /statistics:
    get:
      operationId: getStatistics
      summary: Read public account and non-deleted tree counters
      responses:
        "200":
          description: Current public counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statistics"
  /auth/register:
    post:
      operationId: register
      summary: Register an account and create its first session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account and session created
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/login:
    post:
      operationId: login
      summary: Create an independent session using a username or email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      responses:
        "200":
          description: Tokens rotated
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke only the current session
      security:
        - bearerAuth: []
        - {}
      responses:
        "204":
          description: Session revoked and the refresh cookie expired
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
  /me:
    get:
      operationId: getCurrentUser
      summary: Read the current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateCurrentUser
      summary: Change the profile language
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeLanguageRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /me/avatar:
    get:
      operationId: getAvatar
      summary: Read the current user's protected processed avatar
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Processed square WebP avatar
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: uploadAvatar
      summary: Replace the current user's avatar with a square crop
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageCropUpload"
      responses:
        "200":
          description: Profile with the replaced avatar reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteAvatar
      summary: Delete the current user's avatar and its physical file
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile with no avatar reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/blood-network-presets:
    patch:
      operationId: updateBloodNetworkPresets
      summary: Save the current user's two blood-network force presets
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBloodNetworkPresetsRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees:
    get:
      operationId: listTrees
      summary: List the current owner's trees newest first
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Owner's trees
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTree
      summary: Create an empty family tree
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreeNameRequest"
      responses:
        "201":
          description: Empty tree created
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
            Location:
              description: Snapshot endpoint for the created tree
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyTree"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees/{treeId}:
    parameters:
      - $ref: "#/components/parameters/TreeId"
    patch:
      operationId: renameTree
      summary: Rename an owned tree using optimistic concurrency
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreeNameRequest"
      responses:
        "200":
          description: Tree renamed
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyTree"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteTree
      summary: Irreversibly delete an owned tree and all nested resources
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Tree deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
  /trees/{treeId}/snapshot:
    parameters:
      - $ref: "#/components/parameters/TreeId"
    get:
      operationId: getTreeSnapshot
      summary: Read the compact graph snapshot and current tree version
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current compact graph snapshot
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /trees/{treeId}/graph-mutations:
    parameters:
      - $ref: "#/components/parameters/TreeId"
    post:
      operationId: mutateTreeGraph
      summary: Apply one atomic structural graph mutation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphMutation"
      responses:
        "200":
          description: Structural graph resource removed atomically
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeSnapshot"
        "201":
          description: Graph resources created atomically with coordinates
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees/{treeId}/blood-network-state:
    parameters:
      - $ref: "#/components/parameters/TreeId"
    put:
      operationId: saveBloodNetworkState
      summary: Save the temporary blood-network map state for a tree
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BloodNetworkMapState"
      responses:
        "200":
          description: Saved tree snapshot with the current blood-network map state
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees/{treeId}/marriages/{marriageId}:
    parameters:
      - $ref: "#/components/parameters/TreeId"
      - name: marriageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateMarriagePeriod
      summary: Autosave dates of one marriage period
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarriagePeriodPatchRequest"
      responses:
        "200":
          description: Marriage dates and automatic events updated
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarriagePeriodUpdateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees/{treeId}/people/{personId}:
    parameters:
      - $ref: "#/components/parameters/TreeId"
      - $ref: "#/components/parameters/PersonId"
    get:
      operationId: getPerson
      summary: Read full data for one person in an owned tree
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current person data
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePerson
      summary: Autosave one or more coherent person fields
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonPatchRequest"
      responses:
        "200":
          description: Person fields updated with automatic events synchronized
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonUpdateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees/{treeId}/people/{personId}/events:
    parameters:
      - $ref: "#/components/parameters/TreeId"
      - $ref: "#/components/parameters/PersonId"
    get:
      operationId: listPersonEvents
      summary: Read the chronological timeline for one person
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Person timeline
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createManualEvent
      summary: Create one manual event
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualEventRequest"
      responses:
        "201":
          description: Manual event created
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventMutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees/{treeId}/people/{personId}/photo:
    parameters:
      - $ref: "#/components/parameters/TreeId"
      - $ref: "#/components/parameters/PersonId"
    get:
      operationId: getPersonPhoto
      summary: Read the protected processed full person photo
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Processed full WebP photo
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: uploadPersonPhoto
      summary: Replace the primary photo and create its 3:4 derivatives
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageCropUpload"
      responses:
        "200":
          description: Person and tree version with the replaced photo
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonUpdateResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deletePersonPhoto
      summary: Delete the primary photo attachment and physical variants
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Person and tree version with no photo
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonUpdateResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
  /trees/{treeId}/people/{personId}/photo/{variant}:
    parameters:
      - $ref: "#/components/parameters/TreeId"
      - $ref: "#/components/parameters/PersonId"
      - name: variant
        in: path
        required: true
        schema:
          type: string
          enum:
            - portrait
            - thumbnail
    get:
      operationId: getPersonPhotoVariant
      summary: Read a protected portrait or thumbnail derivative
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Processed WebP derivative
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /trees/{treeId}/people/{personId}/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/TreeId"
      - $ref: "#/components/parameters/PersonId"
      - $ref: "#/components/parameters/EventId"
    patch:
      operationId: updateManualEvent
      summary: Replace the editable fields of one manual event
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualEventRequest"
      responses:
        "200":
          description: Manual event updated
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventMutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteManualEvent
      summary: Delete one manual event
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Manual event deleted
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
  /trees/{treeId}/people/{personId}/event-order:
    parameters:
      - $ref: "#/components/parameters/TreeId"
      - $ref: "#/components/parameters/PersonId"
    put:
      operationId: reorderPersonEvents
      summary: Order events inside one chronologically ambiguous group
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventOrderRequest"
      responses:
        "200":
          description: Timeline reordered
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventOrderResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  headers:
    RefreshCookie:
      description: Secure, HttpOnly, SameSite=Strict refresh-token cookie
      schema:
        type: string
    TreeEtag:
      description: Opaque version of the whole mutable tree state
      schema:
        type: string
  parameters:
    TreeId:
      name: treeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag returned by the latest tree representation
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid JSON or request wire type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Missing, invalid, expired, or revoked session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Authenticated account cannot receive tokens
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: The private resource is missing or unavailable to this owner
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: A unique value or domain invariant conflicts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnsupportedMediaType:
      description: A JSON request body is required
      content:
        application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    PayloadTooLarge:
      description: Uploaded image exceeds the 10 MB limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: One or more fields are invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TreeVersionConflict:
      description: If-Match does not match the current tree version
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    Statistics:
      type: object
      additionalProperties: false
      required:
        - accountCount
        - treeCount
      properties:
        accountCount:
          type: integer
          minimum: 0
        treeCount:
          type: integer
          minimum: 0
    Language:
      type: string
      enum:
        - en
        - ru
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
        - language
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 32
          pattern: "^[A-Za-z0-9_-]+$"
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 64
        language:
          $ref: "#/components/schemas/Language"
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    ChangeLanguageRequest:
      type: object
      additionalProperties: false
      required:
        - language
      properties:
        language:
          $ref: "#/components/schemas/Language"
    BloodNetworkForceSettings:
      type: object
      additionalProperties: false
      required:
        - averageMovementPerSecondThreshold
        - baseRepulsion
        - descendantSideForce
        - personFlowHingeStrength
        - parentChildPathLength
        - unrelatedParentNodeRepulsion
        - kinshipRepulsionStep
        - parentHingeSpringStrength
        - parentHingeTargetAngle
        - parentPairSpringStrength
        - parentToFamilyLengthRatio
        - sharedParentSpringStrength
      properties:
        averageMovementPerSecondThreshold: { type: number, minimum: 0.1, maximum: 5 }
        baseRepulsion: { type: number, minimum: 0.5, maximum: 8 }
        descendantSideForce: { type: number, minimum: 0, maximum: 24 }
        personFlowHingeStrength: { type: number, minimum: 0, maximum: 25 }
        parentChildPathLength: { type: number, minimum: 100, maximum: 500 }
        unrelatedParentNodeRepulsion: { type: number, minimum: 0, maximum: 12 }
        kinshipRepulsionStep: { type: number, minimum: 0.05, maximum: 0.6 }
        parentHingeSpringStrength: { type: number, minimum: 0, maximum: 10 }
        parentHingeTargetAngle: { type: number, minimum: 10, maximum: 120 }
        parentPairSpringStrength: { type: number, minimum: 0.04, maximum: 0.5 }
        parentToFamilyLengthRatio: { type: number, minimum: 0, maximum: 1 }
        sharedParentSpringStrength: { type: number, minimum: 0.02, maximum: 0.8 }
    BloodNetworkPreset:
      type: object
      additionalProperties: false
      required: [id, name, isDefault, forces]
      properties:
        id:
          type: string
          enum: [weak, normal]
        name:
          type: string
          minLength: 1
          maxLength: 80
        isDefault:
          type: boolean
        forces:
          $ref: "#/components/schemas/BloodNetworkForceSettings"
    UpdateBloodNetworkPresetsRequest:
      type: object
      additionalProperties: false
      required: [presets]
      properties:
        presets:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/BloodNetworkPreset"
    TreeNameRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    FamilyTree:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - personCount
        - createdAt
        - updatedAt
        - etag
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        personCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        etag:
          type: string
    TreeList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FamilyTree"
    KnownText:
      oneOf:
        - $ref: "#/components/schemas/KnownTextValue"
        - $ref: "#/components/schemas/UnknownValue"
    KnownTextValue:
      type: object
      additionalProperties: false
      required:
        - state
        - value
      properties:
        state:
          type: string
          const: known
        value:
          type: string
          minLength: 1
          maxLength: 100
    UnknownValue:
      type: object
      additionalProperties: false
      required:
        - state
      properties:
        state:
          type: string
          const: unknown
    GenealogicalDate:
      oneOf:
        - $ref: "#/components/schemas/UnknownValue"
        - $ref: "#/components/schemas/KnownYear"
        - $ref: "#/components/schemas/KnownMonth"
        - $ref: "#/components/schemas/KnownDay"
    KnownYear:
      type: object
      additionalProperties: false
      required:
        - state
        - precision
        - year
        - approximate
      properties:
        state:
          type: string
          const: known
        precision:
          type: string
          const: year
        year:
          type: integer
          minimum: 1582
          maximum: 9999
        approximate:
          type: boolean
    KnownMonth:
      type: object
      additionalProperties: false
      required:
        - state
        - precision
        - year
        - month
        - approximate
      properties:
        state:
          type: string
          const: known
        precision:
          type: string
          const: month
        year:
          type: integer
          minimum: 1582
          maximum: 9999
        month:
          type: integer
          minimum: 1
          maximum: 12
        approximate:
          type: boolean
          const: false
    KnownDay:
      type: object
      additionalProperties: false
      required:
        - state
        - precision
        - year
        - month
        - day
        - approximate
      properties:
        state:
          type: string
          const: known
        precision:
          type: string
          const: day
        year:
          type: integer
          minimum: 1582
          maximum: 9999
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
        approximate:
          type: boolean
          const: false
    Gender:
      type: string
      enum:
        - male
        - female
        - unknown
    Coordinates:
      type: object
      additionalProperties: false
      required:
        - x
        - y
      properties:
        x:
          type: number
        y:
          type: number
    PersonInput:
      type: object
      additionalProperties: false
      required:
        - birthSurname
        - givenName
        - patronymic
        - gender
        - birthDate
        - deathDate
      properties:
        birthSurname:
          $ref: "#/components/schemas/KnownText"
        givenName:
          $ref: "#/components/schemas/KnownText"
        patronymic:
          $ref: "#/components/schemas/KnownText"
        gender:
          $ref: "#/components/schemas/Gender"
        birthDate:
          $ref: "#/components/schemas/GenealogicalDate"
        deathDate:
          oneOf:
            - $ref: "#/components/schemas/GenealogicalDate"
            - type: "null"
    PersonPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        birthSurname:
          $ref: "#/components/schemas/KnownText"
        givenName:
          $ref: "#/components/schemas/KnownText"
        patronymic:
          $ref: "#/components/schemas/KnownText"
        gender:
          $ref: "#/components/schemas/Gender"
        birthDate:
          $ref: "#/components/schemas/GenealogicalDate"
        deathDate:
          oneOf:
            - $ref: "#/components/schemas/GenealogicalDate"
            - type: "null"
    Person:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/PersonInput"
        - type: object
          required:
            - id
            - photoThumbnailUrl
            - coordinates
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
            photoThumbnailUrl:
              type:
                - string
                - "null"
              format: uri-reference
            coordinates:
              $ref: "#/components/schemas/Coordinates"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    PersonUpdateResult:
      type: object
      additionalProperties: false
      required:
        - person
        - etag
      properties:
        person:
          $ref: "#/components/schemas/Person"
        etag:
          type: string
    ImageCropUpload:
      type: object
      additionalProperties: false
      required:
        - image
        - cropX
        - cropY
        - cropWidth
        - cropHeight
      properties:
        image:
          type: string
          format: binary
        cropX:
          type: integer
          minimum: 0
        cropY:
          type: integer
          minimum: 0
        cropWidth:
          type: integer
          minimum: 1
        cropHeight:
          type: integer
          minimum: 1
    TreeMetadata:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TreeSnapshot:
      type: object
      additionalProperties: false
      required:
        - tree
        - etag
        - people
        - parentLinks
        - marriages
      properties:
        tree:
          $ref: "#/components/schemas/TreeMetadata"
        etag:
          type: string
        bloodNetworkState:
          oneOf:
            - $ref: "#/components/schemas/BloodNetworkMapState"
            - type: "null"
        people:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        parentLinks:
          type: array
          items:
            $ref: "#/components/schemas/ParentLink"
        marriages:
          type: array
          items:
            $ref: "#/components/schemas/MarriagePeriod"
    BloodNetworkMapNode:
      type: object
      additionalProperties: false
      required: [id, coordinates]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
        coordinates:
          $ref: "#/components/schemas/Coordinates"
    BloodNetworkViewport:
      type: object
      additionalProperties: false
      required: [x, y, zoom]
      properties:
        x: { type: number, minimum: -1000000, maximum: 1000000 }
        y: { type: number, minimum: -1000000, maximum: 1000000 }
        zoom: { type: number, minimum: 0.1, maximum: 2 }
    BloodNetworkMapState:
      type: object
      additionalProperties: false
      required: [forces, nodes, viewport]
      properties:
        forces:
          $ref: "#/components/schemas/BloodNetworkForceSettings"
        nodes:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: "#/components/schemas/BloodNetworkMapNode"
        viewport:
          $ref: "#/components/schemas/BloodNetworkViewport"
    ParentRole:
      type: string
      enum:
        - father
        - mother
    ParentLink:
      type: object
      additionalProperties: false
      required:
        - id
        - parentId
        - childId
        - role
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ParentRole"
    MarriagePeriod:
      type: object
      additionalProperties: false
      required:
        - id
        - malePersonId
        - femalePersonId
        - marriageDate
        - dissolutionDate
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        malePersonId:
          type: string
          format: uuid
        femalePersonId:
          type: string
          format: uuid
        marriageDate:
          $ref: "#/components/schemas/GenealogicalDate"
        dissolutionDate:
          oneOf:
            - $ref: "#/components/schemas/GenealogicalDate"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MarriagePeriodPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        marriageDate:
          $ref: "#/components/schemas/GenealogicalDate"
        dissolutionDate:
          oneOf:
            - $ref: "#/components/schemas/GenealogicalDate"
            - type: "null"
    MarriagePeriodUpdateResult:
      type: object
      additionalProperties: false
      required:
        - marriage
        - etag
      properties:
        marriage:
          $ref: "#/components/schemas/MarriagePeriod"
        etag:
          type: string
    CoordinateUpdate:
      type: object
      additionalProperties: false
      required:
        - personId
        - coordinates
      properties:
        personId:
          type: string
          format: uuid
        coordinates:
          $ref: "#/components/schemas/Coordinates"
    ExistingRelative:
      type: object
      additionalProperties: false
      required:
        - personId
      properties:
        personId:
          type: string
          format: uuid
    NewRelative:
      type: object
      additionalProperties: false
      required:
        - person
        - coordinates
      properties:
        person:
          $ref: "#/components/schemas/PersonInput"
        coordinates:
          $ref: "#/components/schemas/Coordinates"
    RelativePerson:
      oneOf:
        - $ref: "#/components/schemas/ExistingRelative"
        - $ref: "#/components/schemas/NewRelative"
    ParentSpecification:
      type: object
      additionalProperties: false
      required:
        - personId
        - role
      properties:
        personId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ParentRole"
    GraphMutation:
      oneOf:
        - $ref: "#/components/schemas/CreateFirstPersonMutation"
        - $ref: "#/components/schemas/AddParentMutation"
        - $ref: "#/components/schemas/AddChildMutation"
        - $ref: "#/components/schemas/LinkParentChildMutation"
        - $ref: "#/components/schemas/AddMarriagePeriodMutation"
        - $ref: "#/components/schemas/RemoveParentLinkMutation"
        - $ref: "#/components/schemas/RemoveMarriagePeriodMutation"
        - $ref: "#/components/schemas/DeletePersonMutation"
        - $ref: "#/components/schemas/ReflowCoordinatesMutation"
    CreateFirstPersonMutation:
      type: object
      additionalProperties: false
      required:
        - type
        - person
        - coordinates
      properties:
        type:
          type: string
          const: create_first_person
        person:
          $ref: "#/components/schemas/PersonInput"
        coordinates:
          $ref: "#/components/schemas/Coordinates"
    AddParentMutation:
      type: object
      additionalProperties: false
      required:
        - type
