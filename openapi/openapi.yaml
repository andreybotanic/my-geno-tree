        - $ref: "#/components/schemas/CustomEventRequest"
        - $ref: "#/components/schemas/SurnameChangeEventRequest"
    EventMutationResult:
      type: object
      additionalProperties: false
      required:
        - event
        - etag
      properties:
        event:
          $ref: "#/components/schemas/GenealogicalEvent"
        etag:
          type: string
    EventOrderRequest:
