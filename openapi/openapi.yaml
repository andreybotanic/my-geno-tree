        - role
        - relative
        - coordinateUpdates
      properties:
        type:
          type: string
          const: add_parent
        childId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ParentRole"
        relative:
          $ref: "#/components/schemas/RelativePerson"
        coordinateUpdates:
          type: array
          items:
            $ref: "#/components/schemas/CoordinateUpdate"
    AddChildMutation:
      type: object
      additionalProperties: false
      required:
        - type
        - parents
        - relative
        - coordinateUpdates
      properties:
        type:
          type: string
          const: add_child
        parents:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/ParentSpecification"
        relative:
          $ref: "#/components/schemas/RelativePerson"
        coordinateUpdates:
          type: array
          items:
            $ref: "#/components/schemas/CoordinateUpdate"
    LinkParentChildMutation:
      type: object
      additionalProperties: false
      required:
        - type
        - parentId
        - childId
        - role
        - coordinateUpdates
      properties:
        type:
          type: string
          const: link_parent_child
        parentId:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ParentRole"
        coordinateUpdates:
          type: array
          items:
            $ref: "#/components/schemas/CoordinateUpdate"
    AddMarriagePeriodMutation:
      type: object
      additionalProperties: false
      required:
        - type
