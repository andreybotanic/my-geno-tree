openapi: 3.1.0
info:
  title: MyGenoTree API
  version: 0.1.0
  description: REST API for the local MyGenoTree MVP.
servers:
  - url: https://localhost/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check whether the local API is available
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    ApiError:
      type: object
      required:
        - code
        - fields
        - details
      properties:
        code:
          type: string
        message:
          type:
            - string
            - "null"
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        details:
          type: object
          additionalProperties: true
