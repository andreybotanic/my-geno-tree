openapi: 3.1.0
info:
  title: MyGenoTree API
  version: 0.2.0
  description: REST API for the local MyGenoTree MVP.
servers:
  - url: https://localhost/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check whether the local API is available
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/register:
    post:
      operationId: register
      summary: Register an account and create its first session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account and session created
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/login:
    post:
      operationId: login
      summary: Create an independent session using a username or email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      responses:
        "200":
          description: Tokens rotated
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke only the current session
      security:
        - bearerAuth: []
        - {}
      responses:
        "204":
          description: Session revoked and the refresh cookie expired
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
  /me:
    get:
      operationId: getCurrentUser
      summary: Read the current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateCurrentUser
      summary: Change the profile language
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeLanguageRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  headers:
    RefreshCookie:
      description: Secure, HttpOnly, SameSite=Strict refresh-token cookie
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid JSON or request wire type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Missing, invalid, expired, or revoked session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Authenticated account cannot receive tokens
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: A unique value or domain invariant conflicts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnsupportedMediaType:
      description: A JSON request body is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: One or more fields are invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    Language:
      type: string
      enum:
        - en
        - ru
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
        - language
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 32
          pattern: "^[A-Za-z0-9_-]+$"
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 64
        language:
          $ref: "#/components/schemas/Language"
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    ChangeLanguageRequest:
      type: object
      additionalProperties: false
      required:
        - language
      properties:
        language:
          $ref: "#/components/schemas/Language"
    AuthResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - accessTokenExpiresAt
        - user
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - email
        - preferredLanguage
        - avatarUrl
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        preferredLanguage:
          $ref: "#/components/schemas/Language"
        avatarUrl:
          type:
            - string
            - "null"
          format: uri-reference
        createdAt:
          type: string
          format: date-time
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - fields
        - details
      properties:
        code:
          type: string
        message:
          type:
            - string
            - "null"
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        details:
          type: object
          additionalProperties: true
