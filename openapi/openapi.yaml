        - relative
        - marriageDate
        - dissolutionDate
        - maleNewSurname
        - femaleNewSurname
        - coordinateUpdates
      properties:
        type:
          type: string
          const: add_marriage_period
        personId:
          type: string
          format: uuid
        relative:
          $ref: "#/components/schemas/RelativePerson"
        marriageDate:
          $ref: "#/components/schemas/GenealogicalDate"
        dissolutionDate:
          oneOf:
            - $ref: "#/components/schemas/GenealogicalDate"
            - type: "null"
        maleNewSurname:
          type:
            - string
            - "null"
