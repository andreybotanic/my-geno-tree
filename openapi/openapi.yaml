openapi: 3.1.0
info:
  title: MyGenoTree API
  version: 0.2.0
  description: REST API for the local MyGenoTree MVP.
servers:
  - url: https://localhost/api/v1
paths:
  /trees/{treeId}/merges/{mergeId}/process:
    parameters:
      - name: treeId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: mergeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: processTreeMerge
      description: Processes the latest saved message. Inference runs outside the mutation transaction. Late answers cannot overwrite newer input. Refusals and tree answers preserve the proposal. No genealogical changes are applied.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, requestId]
              properties:
                version: { type: integer, minimum: 1 }
                requestId: { type: string }
      responses:
        "200":
          description: Ready, clarification, no changes or error draft; source remains saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeMergeDraft" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Processing rate limit reached; draft retained.
  /trees/{treeId}/merges/{mergeId}/proposal:
    parameters:
      - name: treeId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: mergeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: reviseTreeMergeProposal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreeMergeProposalRequest" }
      responses:
        "200":
          description: Versioned merge draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeMergeDraft" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees/{treeId}/merges/{mergeId}/revalidate:
    parameters:
      - name: treeId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: mergeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: revalidateTreeMerge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreeMergeVersionRequest" }
      responses:
        "200":
          description: Versioned merge draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeMergeDraft" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees/{treeId}/merges/{mergeId}/apply:
    parameters:
      - name: treeId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: mergeId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: If-Match
        in: header
        required: true
        schema: { type: string }
    post:
      operationId: applyTreeMerge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreeMergeApplyRequest" }
      responses:
        "200":
          description: Versioned merge draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeMergeDraft" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees/{treeId}/merges:
    parameters:
      - name: treeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listTreeMerges
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Merge draft state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeMergeList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      operationId: createTreeMerge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreeMergeCreateRequest" }
      responses:
        "201":
          description: Merge draft state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeMergeDraft" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees/{treeId}/merges/{mergeId}:
    parameters:
      - name: treeId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: mergeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getTreeMerge
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Merge draft state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeMergeDraft" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees/{treeId}/merges/{mergeId}/messages:
    parameters:
      - name: treeId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: mergeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: appendTreeMergeMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreeMergeMessageRequest" }
      responses:
        "200":
          description: Merge draft state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeMergeDraft" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees/{treeId}/merges/{mergeId}/cancel:
    parameters:
      - name: treeId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: mergeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelTreeMerge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TreeMergeVersionRequest" }
      responses:
        "200":
          description: Merge draft state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeMergeDraft" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /health:
    get:
      operationId: getHealth
      summary: Check whether the local API is available
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /statistics:
    get:
      operationId: getStatistics
      summary: Read public account, non-deleted tree and person counters
      responses:
        "200":
          description: Current public counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statistics"
  /auth/register:
    post:
      operationId: register
      summary: Register an account and create its first session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account and session created
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/login:
    post:
      operationId: login
      summary: Create an independent session using a username or email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      responses:
        "200":
          description: Tokens rotated
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke only the current session
      security:
        - bearerAuth: []
        - {}
      responses:
        "204":
          description: Session revoked and the refresh cookie expired
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
  /me:
    get:
      operationId: getCurrentUser
      summary: Read the current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateCurrentUser
      summary: Change the profile language
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeLanguageRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /surname-localization:
    post:
      operationId: localizeSurname
      summary: Convert a surname to the requested gender form in the current user's locale
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurnameLocalizationRequest"
      responses:
        "200":
          description: Localized surname
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurnameLocalizationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /patronymic-localization:
    post:
      operationId: localizePatronymic
      summary: Determine a patronymic from the father's given name in the current user's locale
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatronymicLocalizationRequest"
      responses:
        "200":
          description: Localized patronymic, when the locale has a supported convention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatronymicLocalizationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /me/avatar:
    get:
      operationId: getAvatar
      summary: Read the current user's protected processed avatar
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Processed square WebP avatar
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: uploadAvatar
      summary: Replace the current user's avatar with a square crop
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageCropUpload"
      responses:
        "200":
          description: Profile with the replaced avatar reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteAvatar
      summary: Delete the current user's avatar and its physical file
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile with no avatar reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/blood-network-presets:
    patch:
      operationId: updateBloodNetworkPresets
      summary: Save the current user's two blood-network force presets
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBloodNetworkPresetsRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees:
    get:
      operationId: listTrees
      summary: List the current owner's trees newest first
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Owner's trees
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTree
      summary: Create an empty family tree
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreeNameRequest"
      responses:
        "201":
          description: Empty tree created
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
            Location:
              description: Snapshot endpoint for the created tree
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyTree"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /tree-imports/inspect:
    post:
      operationId: inspectTreeImport
      summary: Recognize and validate a GEDCOM tree before importing it
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TreeImportFile"
      responses:
        "200":
          description: Recognized GEDCOM format, statistics and warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeImportInspection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /tree-imports:
    post:
      operationId: importTree
      summary: Validate a GEDCOM file and atomically create a new family tree
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TreeImportRequest"
      responses:
        "201":
          description: Imported family tree and non-fatal import warnings
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
            Location:
              description: Snapshot endpoint for the imported tree
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeImportResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees/{treeId}/exports:
    parameters:
      - $ref: "#/components/parameters/TreeId"
    post:
      operationId: exportTree
      summary: Export an owned tree as a GEDCOM file
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreeExportRequest"
      responses:
        "200":
          description: UTF-8 GEDCOM download
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/x-gedcom:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees/{treeId}:
    parameters:
      - $ref: "#/components/parameters/TreeId"
    patch:
      operationId: renameTree
      summary: Rename an owned tree using optimistic concurrency
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreeNameRequest"
      responses:
        "200":
          description: Tree renamed
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyTree"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteTree
      summary: Irreversibly delete an owned tree and all nested resources
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Tree deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
  /trees/{treeId}/snapshot:
    parameters:
      - $ref: "#/components/parameters/TreeId"
    get:
      operationId: getTreeSnapshot
      summary: Read the compact graph snapshot and current tree version
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current compact graph snapshot
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /trees/{treeId}/layout:
    parameters:
      - $ref: "#/components/parameters/TreeId"
    put:
      operationId: saveTreeLayout
      summary: Save the derived ordinary-tree layout for the current reference
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveTreeLayoutRequest"
      responses:
        "204":
          description: Layout saved without changing the tree version
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees/{treeId}/reference:
    parameters:
      - $ref: "#/components/parameters/TreeId"
    put:
      operationId: changeTreeReference
      summary: Select a person or an existing marriage as the ordinary-tree reference
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TreeReference"
      responses:
        "200":
          description: Updated tree snapshot
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/TreeVersionConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"
  /trees/{treeId}/graph-mutations:
    parameters:
      - $ref: "#/components/parameters/TreeId"
    post:
      operationId: mutateTreeGraph
      summary: Apply one atomic structural graph mutation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphMutation"
      responses:
        "200":
          description: Structural graph resource removed atomically
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeSnapshot"
        "201":
          description: Graph resources created atomically
          headers:
            ETag:
              $ref: "#/components/headers/TreeEtag"
          content:
