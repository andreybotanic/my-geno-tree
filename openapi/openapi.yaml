        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/BadGateway"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  headers:
    RefreshCookie:
      description: Secure, HttpOnly, SameSite=Strict refresh-token cookie
      schema:
        type: string
    TreeEtag:
      description: Opaque version of the whole mutable tree state
      schema:
        type: string
  parameters:
    TreeId:
      name: treeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag returned by the latest tree representation
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid JSON or request wire type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Missing, invalid, expired, or revoked session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Authenticated account cannot receive tokens
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: The private resource is missing or unavailable to this owner
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: A unique value or domain invariant conflicts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnsupportedMediaType:
      description: A JSON request body is required
      content:
        application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    PayloadTooLarge:
      description: Uploaded image exceeds the 10 MB limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: One or more fields are invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: Shared or per-user request limit exceeded
      headers:
        Retry-After:
          description: Seconds until the request can be retried
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BadGateway:
      description: The upstream geocoding service is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TreeVersionConflict:
      description: If-Match does not match the current tree version
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:

    TreeMergeEvidence:
      type: object
      additionalProperties: false
      required: [messageId, quote]
      properties:
        messageId: { type: string, format: uuid }
        quote: { type: string, minLength: 1 }
    TreeMergePersonProposal:
      type: object
      additionalProperties: false
      required: [id, existingPersonId, resolution, fields, lifeStatus, evidence]
      properties:
        id: { type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$' }
        existingPersonId: { type: [string, "null"], format: uuid }
        resolution: { type: string, enum: [new, existing, undecided] }
        fields: { $ref: "#/components/schemas/PersonPatchRequest" }
        lifeStatus: { type: string, enum: [alive, deceased, uncertain] }
        evidence:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/TreeMergeEvidence" }
        before:
          readOnly: true
          oneOf:
            - { $ref: "#/components/schemas/Person" }
            - { type: "null" }
        candidates:
          readOnly: true
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/PersonSearchResult" }
    TreeMergeParentProposal:
      type: object
      additionalProperties: false
      required: [parent, child, role, evidence]
      properties:
        parent: { type: string }
        child: { type: string }
        role: { type: string, enum: [father, mother] }
        evidence:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/TreeMergeEvidence" }
    TreeMergeMarriageProposal:
      type: object
      additionalProperties: false
      required: [first, second, marriageDate, dissolutionDate, newPeriod, evidence]
      properties:
        first: { type: string }
        second: { type: string }
        marriageDate: { $ref: "#/components/schemas/GenealogicalDate" }
        dissolutionDate:
          oneOf:
            - { $ref: "#/components/schemas/GenealogicalDate" }
            - { type: "null" }
        newPeriod: { type: boolean }
        evidence:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/TreeMergeEvidence" }
    TreeMergeProposal:
      type: object
      additionalProperties: false
      required: [people, parents, marriages, questions]
      properties:
        people:
          type: array
          maxItems: 20
          description: At most five new people; existing matches always require explicit resolution.
          items: { $ref: "#/components/schemas/TreeMergePersonProposal" }
        parents:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/TreeMergeParentProposal" }
        marriages:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/TreeMergeMarriageProposal" }
        questions:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 1000 }
    TreeMergeProposalRequest:
      type: object
      additionalProperties: false
      required: [version, proposal]
      properties:
        version: { type: integer, minimum: 1 }
        proposal: { $ref: "#/components/schemas/TreeMergeProposal" }
    TreeMergeApplyRequest:
      type: object
      additionalProperties: false
      required: [version, proposalVersion]
      properties:
        version: { type: integer, minimum: 1 }
        proposalVersion: { type: integer, minimum: 1 }
    TreeMergeResult:
      type: object
      required: [personIds, affectedPersonIds, etag, proposalVersion]
      properties:
        personIds:
          type: object
          additionalProperties: { type: string, format: uuid }
        affectedPersonIds:
          type: array
          items: { type: string, format: uuid }
        etag: { type: string }
        proposalVersion: { type: integer }
    TreeMergeMessage:
      type: object
      additionalProperties: false
      required: [id, requestId, role, content, createdAt]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string }
        role: { type: string, enum: [user, assistant] }
