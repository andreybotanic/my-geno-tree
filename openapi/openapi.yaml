          maxLength: 100
        femaleNewSurname:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 100
        coordinateUpdates:
          type: array
          items:
            $ref: "#/components/schemas/CoordinateUpdate"
    RemoveParentLinkMutation:
      type: object
      additionalProperties: false
      required:
        - type
        - parentLinkId
        - coordinateUpdates
      properties:
        type:
          type: string
          const: remove_parent_link
        parentLinkId:
          type: string
          format: uuid
        coordinateUpdates:
          type: array
          items:
            $ref: "#/components/schemas/CoordinateUpdate"
    RemoveMarriagePeriodMutation:
      type: object
      additionalProperties: false
      required:
        - type
        - marriageId
        - coordinateUpdates
      properties:
        type:
          type: string
          const: remove_marriage_period
        marriageId:
          type: string
          format: uuid
        coordinateUpdates:
          type: array
          items:
            $ref: "#/components/schemas/CoordinateUpdate"
    DeletePersonMutation:
      type: object
      additionalProperties: false
      required:
        - type
        - personId
        - coordinateUpdates
      properties:
        type:
          type: string
          const: delete_person
        personId:
          type: string
          format: uuid
        coordinateUpdates:
          type: array
          items:
            $ref: "#/components/schemas/CoordinateUpdate"
    ReflowCoordinatesMutation:
      type: object
      additionalProperties: false
      required:
        - type
        - coordinateUpdates
      properties:
        type:
          type: string
          const: reflow_coordinates
        coordinateUpdates:
          type: array
          items:
            $ref: "#/components/schemas/CoordinateUpdate"
    GenealogicalEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - personId
        - type
        - source
        - date
        - title
        - description
        - data
        - sourceEntityType
        - sourceEntityId
        - manualOrder
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - birth
            - death
            - marriage
            - surname_change
            - divorce
            - child_birth
            - custom
        source:
          type: string
          enum:
            - automatic
            - manual
        date:
          $ref: "#/components/schemas/GenealogicalDate"
        title:
          type:
            - string
            - "null"
        description:
          type:
            - string
            - "null"
        data:
          type: object
          additionalProperties: true
        sourceEntityType:
          type:
            - string
            - "null"
        sourceEntityId:
          type:
            - string
            - "null"
          format: uuid
        manualOrder:
          type:
            - integer
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EventList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GenealogicalEvent"
    CustomEventRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - date
        - title
        - description
      properties:
        type:
          type: string
          const: custom
