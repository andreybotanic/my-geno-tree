# The application speaks only OpenAI-compatible HTTP. Switch the external agent
# by changing this URL/key and model; its MCP transport belongs to that service.
ai:
    platform:
        generic:
            tree_merge:
                base_url: 'http://hermes:8642'
                api_key: '%env(TREE_MERGE_AGENT_KEY)%'
                http_client: merge_ai.client
                supports_embeddings: false
    agent:
        tree_merge:
            platform: ai.platform.generic.tree_merge
            model: 'gpt-5.6-luna'
            prompt: !php/const App\Application\TreeMerge\Ai\MergePrompt::SYSTEM
