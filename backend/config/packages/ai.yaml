# Symfony executes tools in the authenticated request. The proxy only calls the model.
ai:
    message_store:
        cache:
            chat:
                service: cache.chat
                ttl: '%app.chat_ttl%'
    platform:
        ollama:
            endpoint: 'http://ollama:11434'
            http_client: document_embeddings.client
        generic:
            chatgpt:
                base_url: 'http://cli-proxy-api:8317'
                api_key: '%env(CLI_PROXY_API_KEY)%'
                http_client: chat_ai.client
                supports_embeddings: false
                model_catalog:
                    models:
                        gpt-5.6-luna:
                            class: Symfony\AI\Platform\Bridge\Generic\CompletionsModel
                            capabilities:
                                - !php/const Symfony\AI\Platform\Capability::INPUT_MESSAGES
                                - !php/const Symfony\AI\Platform\Capability::OUTPUT_TEXT
                                - !php/const Symfony\AI\Platform\Capability::OUTPUT_STRUCTURED
                                - !php/const Symfony\AI\Platform\Capability::TOOL_CALLING
        openresponses:
            chatgpt:
                base_url: 'http://cli-proxy-api:8317'
                api_key: '%env(CLI_PROXY_API_KEY)%'
                http_client: chat_ai.client
    agent:
        tree:
            include_sources: true
            platform: ai.platform.openresponses.chatgpt
            message_store: ai.message_store.cache.chat
            model:
                name: 'gpt-5.6-luna'
                options:
                    stream: true
                    max_output_tokens: 16384
                    parallel_tool_calls: false
            prompt:
                file: '%kernel.project_dir%/prompts/tree.txt'
            max_tool_calls: null
            tools:
                execution_strategy: App\Application\Chat\ChatToolExecutor
                services:
                    - App\Tool\TreeReadTools
                    - App\Tool\TreeWriteTools
                    - Symfony\AI\Agent\Bridge\SimilaritySearch\SimilaritySearch
        chat_moderation:
            platform: ai.platform.generic.chatgpt
            model:
                name: 'gpt-5.6-luna'
                options:
                    max_output_tokens: 1024
            tools: []
            prompt:
                file: '%kernel.project_dir%/prompts/chat_moderation.txt'
    store:
        qdrant:
            documents:
                endpoint: 'http://qdrant:6333'
                collection_name: '%app.document_collection%'
                dimensions: 1024
                metric: Cosine
                async: false
    vectorizer:
        documents:
            platform: ai.platform.ollama
            model: 'qwen3-embedding:0.6b'
    indexer:
        documents:
            vectorizer: ai.vectorizer.documents
            store: ai.store.qdrant.documents
    retriever:
        documents:
            vectorizer: ai.vectorizer.documents
            store: ai.store.qdrant.documents
