doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '18'
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        dql:
            string_functions:
                LEFT_TEXT: App\Infrastructure\Doctrine\Dql\LeftTextFunction
                NORMALIZE_TEXT: App\Infrastructure\Doctrine\Dql\NormalizeTextFunction
                NORMALIZED_FIO: App\Infrastructure\Doctrine\Dql\NormalizedFullNameFunction
            numeric_functions:
                LEAST_INTEGER: App\Infrastructure\Doctrine\Dql\LeastIntegerFunction
                LEVENSHTEIN_LESS_EQUAL: App\Infrastructure\Doctrine\Dql\LevenshteinLessEqualFunction
                STRICT_WORD_MATCH: App\Infrastructure\Doctrine\Dql\StrictWordMatchFunction
                STRICT_WORD_SIMILARITY: App\Infrastructure\Doctrine\Dql\StrictWordSimilarityFunction
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
