framework:
    http_client:
        scoped_clients:
            merge_ai.client:
                base_uri: '%env(OLLAMA_URL)%'
                timeout: 270
                max_duration: 270
    rate_limiter:
        tree_merge:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
            cache_pool: cache.merge_access
            lock_factory: lock.default.factory
