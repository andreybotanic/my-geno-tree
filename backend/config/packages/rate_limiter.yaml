framework:
    rate_limiter:
        yandex_tiles_global:
            policy: sliding_window
            limit: 25
            interval: '1 second'
            cache_pool: cache.map_rate_limiter
            lock_factory: lock.default.factory
        yandex_tiles_user:
            policy: sliding_window
            limit: 180
            interval: '1 minute'
            cache_pool: cache.map_rate_limiter
            lock_factory: lock.default.factory
        geoapify_requests:
            policy: sliding_window
            limit: 5
            interval: '1 second'
            cache_pool: cache.map_rate_limiter
            lock_factory: lock.default.factory
        geoapify_credits:
            policy: sliding_window
            limit: 12000
            interval: '24 hours'
            cache_pool: cache.map_rate_limiter
            lock_factory: lock.default.factory
