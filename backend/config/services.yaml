parameters:
    app.chat_topic_prefix: '%env(MERCURE_JWT_ISSUER)%/api/v1/chat-events/sessions/{sessionId}/conversations/'
    app.chat_ttl: 3600

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    mcp.server.default.builder.configured:
        decorates: mcp.server.default.builder
        class: Mcp\Server\Builder
        factory: ['@App\Mcp\McpToolExecutor', configure]
        arguments: ['@mcp.server.default.builder.configured.inner']
