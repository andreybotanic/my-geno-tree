name: my-geno-tree

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /srv/backend
    environment:
      DATABASE_URL: postgresql://mygenotree:${LOCAL_SERVICE_PASSWORD}@database:5432/mygenotree?serverVersion=18&charset=utf8
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET in the root .env}
      CLI_PROXY_API_KEY: ${CLI_PROXY_API_KEY:?Set CLI_PROXY_API_KEY in the root .env}
    volumes:
      - ./backend:/srv/backend
      - media_storage:/srv/backend/var/storage
    tmpfs:
      - /run/chat:size=512m,mode=1777
    depends_on:
      database:
        condition: service_healthy

  chat-maintenance:
    extends:
      service: backend
    command: ['php', 'bin/console', 'messenger:consume', 'scheduler_default', '--time-limit=3600']
    restart: unless-stopped

  frontend:
    image: node:24.18.0-alpine
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /srv/frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/srv/frontend
      - ./openapi:/srv/openapi:ro

  cli-proxy-api:
    image: eceasy/cli-proxy-api:v8.0.56
    entrypoint: [/bin/sh, /CLIProxyAPI/entrypoint.sh]
    restart: unless-stopped
    environment:
      CLI_PROXY_API_KEY: ${CLI_PROXY_API_KEY:?Set CLI_PROXY_API_KEY in the root .env}
    ports:
      - "127.0.0.1:1455:1455"
    volumes:
      - cli_proxy_auth:/root/.cli-proxy-api
      - ./docker/cli-proxy-api/config.yaml:/CLIProxyAPI/config.template.yaml:ro
      - ./docker/cli-proxy-api/entrypoint.sh:/CLIProxyAPI/entrypoint.sh:ro
    tmpfs:
      - /run/cli-proxy-api:size=1m,mode=0700

  whisper:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    profiles: [ai]
    environment:
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__NUM_WORKERS: 1
    volumes:
      - whisper_models:/home/ubuntu/.cache/huggingface/hub

  database:
    image: postgres:18.4-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: mygenotree
      POSTGRES_USER: mygenotree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mygenotree -d mygenotree"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql

  mercure:
    image: dunglas/mercure:v1.1.5
    environment:
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET in the root .env}
    volumes:
      - ./docker/mercure/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data
      - /config

  proxy:
    image: caddy:2.10.2-alpine
    ports:
      - "443:443"
      - "127.0.0.1:7081:8080"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./backend:/srv/backend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      - mercure

volumes:
  whisper_models:
  cli_proxy_auth:
  postgres_data:
  media_storage:
  caddy_data:
  caddy_config:
