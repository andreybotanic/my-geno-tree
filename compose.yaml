name: my-geno-tree

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /srv/backend
    environment:
      DATABASE_URL: postgresql://mygenotree:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}@database:5432/mygenotree?serverVersion=18&charset=utf8
      AMQP_DSN: amqp://mygenotree:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in the root .env}@rabbitmq:5672/%2f
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in the root .env}
      APP_URL: ${APP_ORIGIN:-https://my-geno-tree.localhost}
      MERCURE_PUBLIC_URL: ${APP_ORIGIN:-https://my-geno-tree.localhost}/.well-known/mercure
      MERCURE_JWT_ISSUER: ${APP_ORIGIN:-https://my-geno-tree.localhost}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET in the root .env}
      CLI_PROXY_API_KEY: ${CLI_PROXY_API_KEY:?Set CLI_PROXY_API_KEY in the root .env}
    volumes:
      - ./backend:/srv/backend
      - media_storage:/srv/backend/var/storage
    tmpfs:
      - /run/chat:size=512m,mode=1777
    depends_on:
      database:
        condition: service_healthy

  chat-maintenance:
    extends:
      service: backend
    command: ['php', 'bin/console', 'messenger:consume', 'scheduler_default', '--time-limit=3600']
    restart: unless-stopped

  frontend:
    image: node:24.18.0-alpine
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /srv/frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/srv/frontend
      - ./openapi:/srv/openapi:ro

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    volumes:
      - document_vectors:/qdrant/storage

  rabbitmq:
    image: rabbitmq:4.4.0-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: mygenotree
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in the root .env}
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - document_queue:/var/lib/rabbitmq

  ollama:
    image: ollama/ollama:0.40.15
    restart: unless-stopped
    volumes:
      - document_models:/root/.ollama

  ollama-init:
    image: ollama/ollama:0.40.15
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['/bin/sh', '-c']
    command: ['until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull qwen3-embedding:0.6b']
    depends_on:
      - ollama

  document-worker:
    extends:
      service: backend
    command: ['php', 'bin/console', 'messenger:consume', 'documents', '--time-limit=3600', '--memory-limit=512M']
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started

  cli-proxy-api:
    image: eceasy/cli-proxy-api:v8.0.56
    entrypoint: [/bin/sh, /CLIProxyAPI/entrypoint.sh]
    restart: unless-stopped
    environment:
      CLI_PROXY_API_KEY: ${CLI_PROXY_API_KEY:?Set CLI_PROXY_API_KEY in the root .env}
    ports:
      - "127.0.0.1:${OAUTH_CALLBACK_PORT:-1455}:1455"
    volumes:
      - cli_proxy_auth:/root/.cli-proxy-api
      - ./docker/cli-proxy-api/config.yaml:/CLIProxyAPI/config.template.yaml:ro
      - ./docker/cli-proxy-api/entrypoint.sh:/CLIProxyAPI/entrypoint.sh:ro
    tmpfs:
      - /run/cli-proxy-api:size=1m,mode=0700

  whisper:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    profiles: [ai]
    environment:
      LOOPBACK_HOST_URL: http://127.0.0.1:8000
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__NUM_WORKERS: 1
    volumes:
      - whisper_models:/home/ubuntu/.cache/huggingface/hub

  voice-gateway:
    image: node:24.18.0-alpine
    profiles: [ai]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /srv/voice-gateway
    command: ['sh', '-lc', 'npm run build && npm start']
    restart: unless-stopped
    environment:
      VOICE_PORT: 8080
      VOICE_AUTH_URL: http://proxy:8082/api/v1/chat-transcription-sessions
      SPEACHES_URL: ws://whisper:8000/v1/realtime
      WHISPER_MODEL: Systran/faster-whisper-small
      VOICE_ORIGINS: https://localhost,${APP_ORIGIN:-https://my-geno-tree.localhost}
    volumes:
      - ./voice-gateway:/srv/voice-gateway
      - ./frontend/src/api:/srv/frontend/src/api:ro
    depends_on:
      - whisper

  database:
    image: postgres:18.4-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: mygenotree
      POSTGRES_USER: mygenotree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mygenotree -d mygenotree"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql

  mercure:
    image: dunglas/mercure:v1.1.5
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-https://my-geno-tree.localhost}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET in the root .env}
    volumes:
      - ./docker/mercure/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data
      - /config

  proxy:
    image: caddy:2.10.2-alpine
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-https://my-geno-tree.localhost}
    ports:
      - "127.0.0.1:${HTTPS_PORT:-443}:443"
      - "127.0.0.1:${REDIRECT_PORT:-7081}:8080"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./backend:/srv/backend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      - mercure

volumes:
  document_vectors:
  document_queue:
  document_models:
  whisper_models:
  cli_proxy_auth:
  postgres_data:
  media_storage:
  caddy_data:
  caddy_config:
