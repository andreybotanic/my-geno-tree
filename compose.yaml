name: my-geno-tree

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /srv/backend
    environment:
      DATABASE_URL: postgresql://mygenotree:${LOCAL_SERVICE_PASSWORD}@database:5432/mygenotree?serverVersion=18&charset=utf8
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET in the root .env}
      TREE_MERGE_AGENT_KEY: ${TREE_MERGE_AGENT_KEY:?Set TREE_MERGE_AGENT_KEY in the root .env}
      TREE_MERGE_MCP_KEY: ${TREE_MERGE_MCP_KEY:?Set TREE_MERGE_MCP_KEY in the root .env}
    volumes:
      - ./backend:/srv/backend
      - media_storage:/srv/backend/var/storage
    tmpfs:
      - /run/tree-merge:size=512m,mode=1777
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: node:24.18.0-alpine
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /srv/frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/srv/frontend
      - ./openapi:/srv/openapi:ro

  ollama:
    image: ollama/ollama:0.40.12
    profiles: [ai]
    environment:
      OLLAMA_CONTEXT_LENGTH: 32768
    volumes:
      - ollama_models:/root/.ollama

  hermes:
    image: nousresearch/hermes-agent:v0.22.7@sha256:e6d81ae52ebf6a43efa529701405509f20054ba818f179ddd748bed4f8af584c
    command: [gateway, run]
    restart: unless-stopped
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${TREE_MERGE_AGENT_KEY:?Set TREE_MERGE_AGENT_KEY in the root .env}
      TREE_MERGE_MCP_KEY: ${TREE_MERGE_MCP_KEY:?Set TREE_MERGE_MCP_KEY in the root .env}
    volumes:
      - hermes_data:/opt/data
      - ./docker/hermes/config.yaml:/opt/data/config.yaml:ro
    healthcheck:
      test: ["CMD", "/opt/hermes/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      - proxy

  whisper:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    profiles: [ai]
    environment:
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__NUM_WORKERS: 1
    volumes:
      - whisper_models:/home/ubuntu/.cache/huggingface/hub

  database:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: mygenotree
      POSTGRES_USER: mygenotree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mygenotree -d mygenotree"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql

  mercure:
    image: dunglas/mercure:v1.1.5
    environment:
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:?Set MERCURE_JWT_SECRET in the root .env}
    volumes:
      - ./docker/mercure/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data
      - /config

  proxy:
    image: caddy:2.10.2-alpine
    ports:
      - "443:443"
      - "127.0.0.1:7081:8080"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./backend:/srv/backend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      - mercure

volumes:
  whisper_models:
  ollama_models:
  hermes_data:
  postgres_data:
  media_storage:
  caddy_data:
  caddy_config:
